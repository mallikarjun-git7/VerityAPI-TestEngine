[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    api: REST API tests
    e2e: End-to-end UI tests
    smoke: Smoke tests — fast, critical path only
    slow: Tests with intentionally high latency or wait times

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    --html=reports/test_report.html
    --self-contained-html

# Logging
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
